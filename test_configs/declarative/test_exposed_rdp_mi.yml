# Exposed-host foothold (exposed RDP) -> ManagedIdentityAbuse (atomic).
# The attacker brute-forces an internet-exposed VM, gains code execution, and pivots
# through the VM's managed identity to read a Key Vault secret. The `initial_access`
# knob carries the vector; the foothold VM is the MI source.
#
# Live test:
#   python badzure.py build --config test_configs/declarative/test_exposed_rdp_mi.yml --verbose
#   python badzure.py destroy --verbose

tenant:
  tenant_id: null
  domain: null
  subscription_id: null
baseline:
  identities:
    users: 2
    groups: 1
    applications: 2
  resources:
    key_vaults: 1
    virtual_machines: 5
attack_paths:
  exposed_rdp_to_keyvault:
    privilege_escalation: ManagedIdentityAbuse
    initial_access: exposed_rdp        # brute-force an internet-exposed VM -> code exec
    source_type: vm                     # the foothold VM is the managed-identity source
    target_resource_type: key_vault
    expose_to_internet: true           # flip to true to open RDP/SSH to 0.0.0.0/0
    credential: known                   # 'weak' sets a brute-forceable admin password
    method: APIPermission
    api_type: graph
    app_role:
    - 06b708a9-e830-4db3-a914-8e69da51d44f

  exposed_ssh_to_keyvault:
    privilege_escalation: ManagedIdentityAbuse
    initial_access: exposed_ssh      # brute-force an internet-exposed VM -> code exec
    source_type: vm                     # the foothold VM is the managed-identity source
    target_resource_type: key_vault
    expose_to_internet: true           # flip to true to open RDP/SSH to 0.0.0.0/0
    credential: known                   # 'weak' sets a brute-forceable admin password
    method: APIPermission
    api_type: graph
    app_role:
    - 06b708a9-e830-4db3-a914-8e69da51d44f