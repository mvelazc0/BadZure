# Declarative rewrite of test_configs/legacy/test_mi_abuse_all.yml
# Tier-1 `technique:` sugar - same chain, new shape. Live test:
#   python badzure.py build --config test_configs/declarative/test_mi_abuse_all.yml --verbose
#   python badzure.py destroy --verbose

tenant:
  tenant_id: null
  domain: null
  subscription_id: null
baseline:
  identities:
    users: 10
    groups: 5
    applications: 12
  resources:
    key_vaults: 3
    storage_accounts: 2
    virtual_machines: 2
    logic_apps: 1
    automation_accounts: 2
    function_apps: 2
    cosmos_dbs: 2
attack_paths:
  mi_vm_keyvault_user:
    privilege_escalation: ManagedIdentityAbuse
    source_type: vm
    target_resource_type: key_vault
    initial_access: user
    method: APIPermission
    api_type: graph
    app_role:
    - 06b708a9-e830-4db3-a914-8e69da51d44f
    - 19dbc75e-c2e2-444c-a770-ec69d8559fc7
  mi_vm_cosmos_user:
    privilege_escalation: ManagedIdentityAbuse
    source_type: vm
    target_resource_type: cosmos_db
    initial_access: user
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_logicapp_storage_sp:
    privilege_escalation: ManagedIdentityAbuse
    source_type: logic_app
    target_resource_type: storage_account
    initial_access: service_principal
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_automation_keyvault_group_cert:
    privilege_escalation: ManagedIdentityAbuse
    source_type: automation_account
    target_resource_type: key_vault
    assignment_type: group_member
    credential_type: certificate
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_automation_cosmos_sp_owner:
    privilege_escalation: ManagedIdentityAbuse
    source_type: automation_account
    target_resource_type: cosmos_db
    initial_access: service_principal
    assignment_type: group_owner
    method: APIPermission
    api_type: graph
    app_role: 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8
  mi_functionapp_storage_user_cert:
    privilege_escalation: ManagedIdentityAbuse
    source_type: function_app
    target_resource_type: storage_account
    initial_access: user
    credential_type: certificate
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f
  mi_functionapp_keyvault_user_cert:
    privilege_escalation: ManagedIdentityAbuse
    source_type: function_app
    target_resource_type: key_vault
    initial_access: user
    credential_type: certificate
    method: APIPermission
    api_type: graph
    app_role: 19dbc75e-c2e2-444c-a770-ec69d8559fc7
