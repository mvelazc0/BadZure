# Consolidated CosmosDBSecretTheft test — all variants in ONE build
# (replaces test_cosmos_theft_{user,sp,group}.yml for a single run).
#   python badzure.py build --config .test_configs/test_cosmos_all.yml --verbose
#   python badzure.py destroy --verbose
tenant:
  tenant_id: null
  domain: null
  subscription_id: null
  users: 4
  applications: 6
  groups: 2
  administrative_units: 0
  resource_groups: 1
  key_vaults: 0
  storage_accounts: 0
  virtual_machines: 0
  logic_apps: 0
  automation_accounts: 0
  function_apps: 0
  cosmos_dbs: 3
attack_paths:
  cosmos_user:
    enabled: true
    privilege_escalation: CosmosDBSecretTheft
    initial_access: user
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  cosmos_sp:
    enabled: true
    privilege_escalation: CosmosDBSecretTheft
    initial_access: service_principal
    method: APIPermission
    api_type: graph
    app_role: 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8
  cosmos_group:
    enabled: true
    privilege_escalation: CosmosDBSecretTheft
    initial_access: user
    assignment_type: group_member
    method: APIPermission
    api_type: graph
    app_role: random
