# Phase-3 declarative HYBRID config (Slice 3) — a random org-baseline plus two
# attack paths: one fully declared, one that PICKS its victim/target from the
# baseline (`from: baseline`). Both origins deploy from one model.
#
# Live test:
#   python badzure.py build --config .test_configs/declarative_hybrid.yml --verbose
#   python badzure.py destroy --verbose
schema: graph

tenant:
  tenant_id: null
  domain: null
  subscription_id: null

# Random org-baseline noise (origin: random). Counts, not entities.
baseline:
  identities: { users: 15, groups: 4, applications: 6, administrative_units: 2 }
  resources:  { key_vaults: 2 }                      # opt-in (real cost/time)
  assignments: { group_memberships: 12, entra_roles: 4, api_permissions: 3 }

attack_paths:

  # 1) Fully-declared KeyVaultSecretTheft-equivalent chain.
  declared_kv_theft:
    objective: { name: "Global Administrator via Key Vault", impact: critical,
                 capability: entra_role, role: "Global Administrator" }
    initial_access: { method: compromised_identity, principal_ref: alice }
    identities:
      users:        [{ ref: alice }]
      applications: [{ ref: app_highpriv }]
    resources:
      # ref doubles as the real KV name -> must be globally unique (3-24 chars).
      key_vaults:   [{ ref: kv-replace-me }]
    assignments:
      - { id: a1, type: azure_rbac, principal_ref: alice,
          role: "Key Vault Contributor", scope_ref: kv-replace-me }
      - { id: a2, type: entra_role, principal_ref: app_highpriv,
          role: "Global Administrator" }
    credentials:
      - { ref: app_secret, app_ref: app_highpriv, type: password }
    data_injects:
      - { id: d1, material: app_secret, credential_ref: app_secret,
          location: key_vault_secret, location_ref: kv-replace-me, name: client-secret-app-highpriv }

  # 2) Opportunistic path: borrow a believable victim + a target vault from the baseline.
  opportunistic_kv:
    objective: { name: "Key Vault secrets", impact: high,
                 capability: read_secrets, target_ref: kv }   # kv is a from:baseline alias
    initial_access: { method: compromised_identity, principal_ref: victim }
    identities:
      users: [{ ref: victim, from: baseline }]
    resources:
      key_vaults: [{ ref: kv, from: baseline }]
    assignments:
      - { id: a1, type: azure_rbac, principal_ref: victim,
          role: "Key Vault Contributor", scope_ref: kv }
