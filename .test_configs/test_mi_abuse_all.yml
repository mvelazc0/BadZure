# Consolidated ManagedIdentityAbuse test — all variants in ONE build
# (replaces the 7 test_mi_abuse_*.yml fixtures for a single run).
#   python badzure.py build --config .test_configs/test_mi_abuse_all.yml --verbose
#   python badzure.py destroy --verbose
#
# IMPORTANT: every path uses a DISTINCT (source_type, target_resource_type) pair.
# The random selector does not track used source/target resources, so two paths
# sharing the same (source, target) could pick the same instances and produce
# colliding managed-identity role assignments at apply time. Distinct pairs make
# the combined run conflict-free. Coverage: all 4 sources x 3 targets, secret +
# certificate credentials, and user / service_principal / group_member / group_owner.
#
# This is the heaviest lab (2 VMs + 2 function apps + logic app + 2 automation
# accounts + 3 key vaults + 2 storage + 2 cosmos) — expect a longer apply.
tenant:
  tenant_id: null
  domain: null
  subscription_id: null
  users: 8
  applications: 12
  groups: 2
  administrative_units: 0
  resource_groups: 2
  key_vaults: 3
  storage_accounts: 2
  virtual_machines: 2
  logic_apps: 1
  automation_accounts: 2
  function_apps: 2
  cosmos_dbs: 2
attack_paths:
  mi_vm_keyvault_user:                 # vm -> key_vault (user, secret)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: vm
    target_resource_type: key_vault
    initial_access: user
    method: APIPermission
    api_type: graph
    app_role:
    - 06b708a9-e830-4db3-a914-8e69da51d44f
    - 19dbc75e-c2e2-444c-a770-ec69d8559fc7
  mi_vm_cosmos_user:                   # vm -> cosmos_db (user)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: vm
    target_resource_type: cosmos_db
    initial_access: user
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_logicapp_storage_sp:              # logic_app -> storage_account (service principal)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: logic_app
    target_resource_type: storage_account
    initial_access: service_principal
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_automation_keyvault_group_cert:   # automation_account -> key_vault (group_member, certificate)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: automation_account
    target_resource_type: key_vault
    assignment_type: group_member
    credential_type: certificate
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  mi_automation_cosmos_sp_owner:       # automation_account -> cosmos_db (sp, group_owner)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: automation_account
    target_resource_type: cosmos_db
    initial_access: service_principal
    assignment_type: group_owner
    method: APIPermission
    api_type: graph
    app_role: 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8
  mi_functionapp_storage_user_cert:    # function_app -> storage_account (user, certificate)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: function_app
    target_resource_type: storage_account
    initial_access: user
    credential_type: certificate
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f
  mi_functionapp_keyvault_user_cert:   # function_app -> key_vault (user, certificate)
    enabled: true
    privilege_escalation: ManagedIdentityAbuse
    source_type: function_app
    target_resource_type: key_vault
    initial_access: user
    credential_type: certificate
    method: APIPermission
    api_type: graph
    app_role: 19dbc75e-c2e2-444c-a770-ec69d8559fc7
