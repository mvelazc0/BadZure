# Phase-3 declarative graph config (Slice 1) — a KeyVaultSecretTheft-equivalent
# chain written declaratively instead of via the `privilege_escalation:` macro.
#
# Live test:
#   python badzure.py build --config .test_configs/declarative_kv_theft.yml --verbose
#   python badzure.py destroy --verbose
#
# tenant_id/domain/subscription_id resolve from BADZURE_* env vars when null.
schema: graph

tenant:
  tenant_id: null
  domain: null
  subscription_id: null

attack_paths:
  kv_theft:
    objective:
      name: "Key Vault secrets"
      impact: high
      description: "Read a high-privilege app's client secret stored in a Key Vault."
    metadata:
      complexity: low
      tags: [key-vault]
      mitre: [T1078, T1552]
    initial_access:
      method: compromised_identity
      principal_ref: alice

    identities:
      users:        [{ ref: alice }]
      applications: [{ ref: app_highpriv }]
    resources:
      # On this declarative path the ref doubles as the real Key Vault name, which
      # must be GLOBALLY UNIQUE (3-24 chars, lowercase alphanumerics + hyphens).
      # Change kv-replace-me to your own unique value in all three places below.
      key_vaults:   [{ ref: kv-replace-me }]

    assignments:
      # alice can manage the vault (Key Vault Contributor -> read any secret).
      - { id: a1, type: azure_rbac, principal_ref: alice,
          role: "Key Vault Contributor", scope_ref: kv-replace-me }
      # the looted app is Global Administrator — reading its secret is the escalation.
      - { id: a2, type: entra_role, principal_ref: app_highpriv,
          role: "62e90394-69f5-4237-9190-012177145e10" }

    credentials:
      - { ref: app_secret, app_ref: app_highpriv, type: password }

    data_injects:
      - { id: d1, material: app_secret, credential_ref: app_secret,
          location: key_vault_secret, location_ref: kv-replace-me, name: client-secret-app-highpriv }
