# Consolidated ApplicationOwnershipAbuse test — all variants in ONE build
# (replaces test_app_ownership_{user_role,sp_api,sp_exchange}.yml).
#   python badzure.py build --config .test_configs/test_app_ownership_all.yml --verbose
#   python badzure.py destroy --verbose
# Note: groups can't own apps, so group_* assignment_types fall back to direct.
tenant:
  tenant_id: null
  domain: null
  subscription_id: null
  users: 4
  applications: 8
  groups: 2
  administrative_units: 0
  resource_groups: 0
  key_vaults: 0
  storage_accounts: 0
  virtual_machines: 0
  logic_apps: 0
  automation_accounts: 0
  function_apps: 0
  cosmos_dbs: 0
attack_paths:
  ownership_user_role:
    enabled: true
    privilege_escalation: ApplicationOwnershipAbuse
    initial_access: user
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10
  ownership_sp_api:
    enabled: true
    privilege_escalation: ApplicationOwnershipAbuse
    initial_access: service_principal
    method: APIPermission
    api_type: graph
    app_role:
    - 06b708a9-e830-4db3-a914-8e69da51d44f
    - 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8
  ownership_sp_exchange:
    enabled: true
    privilege_escalation: ApplicationOwnershipAbuse
    initial_access: service_principal
    method: APIPermission
    api_type: exchange
    app_role: dc890d15-9560-4a4c-9b7f-a736ec74ec40
