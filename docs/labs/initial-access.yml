# =============================================================================
# Documentation lab: the initial-access vectors.
#
# One attack path per way an attacker first lands in the lab, with stable path
# names so the Initial Access page can embed each entry point. Every path then
# continues through the same managed-identity pivot, so the graphs differ only in
# how the attacker gets in.
#
# Panel keys: attack-credential · attack-exposed_rdp · attack-exposed_ssh ·
#             attack-vulnerable_web_app  (and their posture-* pairs)
#
# Verify:  python BadZure.py check  --config docs/labs/initial-access.yml
# Preview: python BadZure.py report --config docs/labs/initial-access.yml
# =============================================================================
tenant:
  tenant_id: null
  domain: null
  subscription_id: null

baseline:
  identities: { users: 6, groups: 2, applications: 6 }
  resources:
    resource_groups: 3
    key_vaults: 4
    virtual_machines: 3
    app_services: 1

attack_paths:

  # The attacker already holds a user's credentials (phished, sprayed, leaked).
  credential:
    initial_access: { vector: compromised_credential, principal_type: user }
    privilege_escalation:
      technique: ManagedIdentityAbuse
      source_type: vm
      privilege_source: stored_credential
      target_resource_type: key_vault
      credential_type: secret
    objective:
      entra_role: 62e90394-69f5-4237-9190-012177145e10   # Global Administrator

  # An internet-exposed VM with RDP open, reached by brute force.
  exposed_rdp:
    initial_access:
      vector: exposed_rdp
      expose_to_internet: true
      credential: weak
    privilege_escalation:
      technique: ManagedIdentityAbuse
      source_type: vm
      privilege_source: stored_credential
      target_resource_type: key_vault
      credential_type: secret
    objective:
      entra_role: 62e90394-69f5-4237-9190-012177145e10

  # An internet-exposed VM with SSH open, reached by brute force.
  exposed_ssh:
    initial_access:
      vector: exposed_ssh
      expose_to_internet: true
      credential: weak
    privilege_escalation:
      technique: ManagedIdentityAbuse
      source_type: vm
      privilege_source: stored_credential
      target_resource_type: key_vault
      credential_type: secret
    objective:
      entra_role: 62e90394-69f5-4237-9190-012177145e10

  # An internet-facing App Service with a code-execution bug.
  vulnerable_web_app:
    initial_access:
      vector: vulnerable_web_app
      variant: rce
    privilege_escalation:
      technique: ManagedIdentityAbuse
      source_type: app_service
      privilege_source: stored_credential
      target_resource_type: key_vault
      credential_type: secret
    objective:
      entra_role: 62e90394-69f5-4237-9190-012177145e10
