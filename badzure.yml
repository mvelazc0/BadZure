# BadZure Configuration File
# =============================================================================
# The annotated reference config. BadZure has ONE config shape — a declarative
# graph with two parts:
#
#   baseline:       the realistic background ORGANIZATION (benign noise)
#   attack_paths:   the deliberate MISCONFIGURATIONS layered on top
#
# This file deploys a full demo lab: a small org baseline + one attack path per
# technique + one hand-authored ("explicit") path. It is heavily commented so you
# can copy a path, tweak the knobs, and delete what you don't want.
#
#   COST NOTE: every attack_path and every baseline resource is REAL Azure/Entra.
#   This file as-is creates ~8 attack paths + VMs/Key Vaults/Storage/Cosmos. Trim
#   `attack_paths:` (and `baseline.resources`) to reduce cost/time.
#
# Run:   python badzure.py build            # uses this file (badzure.yml)
#        python badzure.py destroy
# Docs:  https://www.badzure.com/configuration/
# =============================================================================

tenant:
  # REQUIRED. Set here, or leave null and provide via .env
  # (BADZURE_TENANT_ID / BADZURE_DOMAIN / BADZURE_SUBSCRIPTION_ID).
  tenant_id: null
  domain: null
  subscription_id: null

# =============================================================================
# baseline: — the background organization
# =============================================================================
# WHAT IT IS
#   The realistic tenant the attack lands in: ordinary users, groups, apps,
#   resources, and the everyday assignments between them. Everything created here
#   is BENIGN (origin: random) — it is NOT part of any attack path.
#
# WHY IT EXISTS
#   1. Realism — a `privilege_escalation:` path picks its victim/target FROM the baseline, so
#      the attack lands on believable entities instead of obviously-synthetic ones.
#   2. Detection & training — benign "noise" assignments surround the deliberate
#      attack edges, so the misconfiguration isn't trivially the only assignment in
#      the tenant (defenders have to find the needle in the haystack).
#   3. It is the surface an LLM can generate ("make me a 200-person fintech org").
#
#   At deploy time BadZure reports the split, e.g.:
#       Total assignments created: 31 (baseline: 7, attack-path: 24)
#   baseline = origin:random, attack-path = origin:attack_path.
#
# A `privilege_escalation:` attack path needs the entity TYPES it consumes to exist in the
# baseline (e.g. KeyVaultSecretTheft needs a key_vault) — or be declared inline on
# the path. If missing, the build fails with a clear message.
baseline:

  # Entities to fabricate (counts). Names are drawn from entity_data/*.txt.
  identities:
    users: 8
    groups: 3
    applications: 12
    administrative_units: 2

  # Azure resources to create. Only declare the types your attack paths need —
  # these cost real money and time. (Resource groups are created automatically.)
  resources:
    key_vaults: 2
    storage_accounts: 1
    # Two VM-source MI paths (mi_abuse + mi_abuse_exposed_rdp) need two VMs — each MI
    # path requires its own source resource (sharing one collides on apply).
    virtual_machines: 2
    # NOTE: App Service creation is throttled per subscription — running multiple
    # build/destroy iterations in a short period can cause throttling errors.
    # Two app_service-source MI paths (mi_abuse_app_service + mi_abuse_vulnerable_webapp).
    app_services: 2
    cosmos_dbs: 1

  # Benign org "noise": realistic everyday assignments (all origin: random) that
  # make the tenant look lived-in. OPTIONAL — omit this block for a clean lab with
  # only the attack edges. Each key is a COUNT of one of the 9 primitive types.
  assignments:
    group_memberships: 8     # users/groups added to groups
    entra_roles: 3           # low-priv directory roles on users/apps
    api_permissions: 2       # benign Graph permissions on apps
    au_memberships: 2        # users/groups in administrative units
    azure_rbac: 5            # Reader/Contributor/... over the baseline resources
    group_ownerships: 2      # users owning groups
    app_ownerships: 2        # users owning app registrations
    app_credentials: 3       # client secrets on service principals
    data_injects: 2          # benign secrets/blobs in the baseline vaults/storage

# =============================================================================
# attack_paths: — the deliberate misconfigurations
# =============================================================================
# Each named path is active by default; set `enabled: false` to PARK a path (keep it
# defined in the file but skip deploying it). A path is authored in one of two tiers:
#
#   TIER 1 (built-in):         `privilege_escalation: <Name>` + a few knobs. BadZure auto-wires
#                              the whole chain and picks victims/targets from the
#                              baseline. Easiest; one technique per path.
#   TIER 2 (explicit graph):   hand-author `objective` + `assignments` + `data_injects`
#                              for arbitrary multi-hop chains. See the last path.
#
# Atomic knobs (shared):
#   initial_access:  user (default) | service_principal       (compromised identity)
#                    exposed_rdp | exposed_ssh                 (ManagedIdentityAbuse + source_type: vm only:
#                                                               brute-force an internet-exposed VM -> code exec)
#   assignment_type: direct (default) | group_member | group_owner
#   method:          AzureADRole  -> entra_role: <GUID> | [GUIDs] | random
#                    APIPermission -> api_type: graph (default) | exchange
#                                     app_role:  <GUID> | [GUIDs] | random
# Per-technique knobs are noted on each path below.
# =============================================================================
attack_paths:

  # ---------------------------------------------------------------------------
  # 1. ApplicationOwnershipAbuse — you OWN a high-priv app; add creds; become it.
  #    Knobs: initial_access, method/entra_role/app_role.
  #    NOTE: group_member/group_owner are NOT supported (Azure forbids group app
  #    owners) and silently fall back to direct — use Application/CloudApp Admin
  #    for group-based app attacks.
  # ---------------------------------------------------------------------------
  app_ownership:
    privilege_escalation: ApplicationOwnershipAbuse
    initial_access: user                 # or: service_principal
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10   # Global Administrator

  # ---------------------------------------------------------------------------
  # 2. ApplicationAdministratorAbuse — hold the App Admin role; manage ANY app.
  #    Extra knob: scope: directory (default) | application (role scoped to 1 app).
  # ---------------------------------------------------------------------------
  app_admin:
    privilege_escalation: ApplicationAdministratorAbuse
    initial_access: service_principal
    scope: application                   # tenant-wide if omitted
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10   # Global Administrator

  # ---------------------------------------------------------------------------
  # 3. CloudAppAdministratorAbuse — narrower-scope cousin of App Admin.
  #    Shown here inherited through a GROUP (assignment_type: group_member).
  # ---------------------------------------------------------------------------
  cloud_app_admin:
    privilege_escalation: CloudAppAdministratorAbuse
    assignment_type: group_member        # or: group_owner | direct
    method: APIPermission
    api_type: graph                      # or: exchange
    app_role: 9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8     # RoleManagement.ReadWrite.Directory

  # ---------------------------------------------------------------------------
  # 4. KeyVaultSecretTheft — read a high-priv app's secret out of a Key Vault.
  #    Needs a key_vault in the baseline (above). `random` picks a high-priv role.
  # ---------------------------------------------------------------------------
  kv_theft:
    privilege_escalation: KeyVaultSecretTheft
    method: AzureADRole
    entra_role: random                   # any high-privileged Entra role

  # ---------------------------------------------------------------------------
  # 5. StorageCertificateTheft — steal an app's certificate from blob storage.
  #    Needs a storage_account. SP initial access + multiple Graph permissions.
  # ---------------------------------------------------------------------------
  storage_theft:
    privilege_escalation: StorageCertificateTheft
    initial_access: service_principal
    method: APIPermission
    api_type: graph
    app_role:
      - 06b708a9-e830-4db3-a914-8e69da51d44f   # AppRoleAssignment.ReadWrite.All
      - 19dbc75e-c2e2-444c-a770-ec69d8559fc7   # Directory.ReadWrite.All

  # ---------------------------------------------------------------------------
  # 6. CosmosDBSecretTheft — read an app secret from Cosmos DB. Needs a cosmos_db.
  #    Shown here via GROUP OWNERSHIP (you own a group that holds the access).
  # ---------------------------------------------------------------------------
  cosmos_theft:
    privilege_escalation: CosmosDBSecretTheft
    assignment_type: group_owner
    method: AzureADRole
    entra_role: 62e90394-69f5-4237-9190-012177145e10   # Global Administrator

  # ---------------------------------------------------------------------------
  # 7. ManagedIdentityAbuse — control a compute resource, steal its managed
  #    identity, pivot to a data resource holding an app credential.
  #    Knobs: source_type (vm | logic_app | automation_account | function_app | app_service),
  #           target_resource_type (key_vault | storage_account | cosmos_db),
  #           credential_type (secret | certificate).
  #    Needs the source compute + target resource in the baseline (vm + key_vault).
  # ---------------------------------------------------------------------------
  mi_abuse:
    privilege_escalation: ManagedIdentityAbuse
    source_type: vm
    target_resource_type: key_vault
    credential_type: secret
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f     # AppRoleAssignment.ReadWrite.All

  # 7a. ManagedIdentityAbuse with an App Service source. The attacker holds
  #     Website Contributor on the app and steals its managed identity token via
  #     the Kudu/SCM REST API (no application vulnerability needed). Needs an
  #     app_service in the baseline.
  # ---------------------------------------------------------------------------
  mi_abuse_app_service:
    privilege_escalation: ManagedIdentityAbuse
    source_type: app_service
    target_resource_type: key_vault
    credential_type: secret
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f     # AppRoleAssignment.ReadWrite.All

  # 7b. ManagedIdentityAbuse reached via an EXPOSED-HOST foothold (initial access).
  #     Instead of a compromised identity, the attacker brute-forces an internet-
  #     exposed VM (RDP/SSH), gains code execution, and pivots through the VM's
  #     managed identity. The foothold VM is the MI source, so source_type must be vm.
  #     expose_to_internet (default false): keep RDP/SSH open to the operator IP only;
  #       set true to add a 0.0.0.0/0 rule (reachable + brute-forceable from anywhere).
  #     credential (default known): keep the strong generated password; set weak for a
  #       brute-forceable one. The build surfaces the VM public IP + admin credentials.
  # ---------------------------------------------------------------------------
  mi_abuse_exposed_rdp:
    privilege_escalation: ManagedIdentityAbuse
    initial_access: exposed_rdp
    source_type: vm
    target_resource_type: key_vault
    expose_to_internet: false            # set true to open RDP/SSH to 0.0.0.0/0
    credential: known                    # set weak for a brute-forceable password
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f     # AppRoleAssignment.ReadWrite.All

  # 7c. ManagedIdentityAbuse reached via a VULNERABLE WEB APP foothold (initial
  #     access). Instead of a compromised identity, the attacker exploits an
  #     internet-facing App Service (command injection on the diagnostics page),
  #     gains code execution in the app's process context, and pivots through the
  #     app's managed identity. The vulnerable app is the MI source, so source_type
  #     must be app_service. variant (default rce) selects the vulnerability class.
  #     expose_to_internet (default false): restrict the app to your operator IP via
  #       App Service access restrictions; set true to open it to the internet.
  #     The build surfaces the app URL + the vulnerable endpoint. Needs an
  #     app_service in the baseline.
  # ---------------------------------------------------------------------------
  mi_abuse_vulnerable_webapp:
    privilege_escalation: ManagedIdentityAbuse
    initial_access: vulnerable_web_app
    source_type: app_service
    target_resource_type: key_vault
    variant: rce                         # command-injection diagnostics page
    expose_to_internet: false            # set true to open the app to the internet
    method: APIPermission
    api_type: graph
    app_role: 06b708a9-e830-4db3-a914-8e69da51d44f     # AppRoleAssignment.ReadWrite.All

  # ---------------------------------------------------------------------------
  # 8. TIER 2 — explicit graph (power users / LLM-authored).
  #    Instead of `privilege_escalation:`, hand-author the chain from generic primitives:
  #    a user with Key Vault Contributor reads a planted secret and authenticates
  #    as a Global-Admin app. `privilege_escalation:` and `assignments:` are mutually exclusive.
  #    Entities are declared INLINE here (not picked from the baseline).
  #    Reference: docs (Authoring an explicit graph) + examples/chained/.
  # ---------------------------------------------------------------------------
  explicit_kv_to_ga:
    objective:
      name: "Global Administrator via Key Vault"
      impact: critical
      capability: entra_role
      role: "Global Administrator"
    initial_access: { method: compromised_identity, principal_ref: priya }
    identities:
      users:        [{ ref: priya }]
      applications: [{ ref: billing-sync-app }]
    resources:
      # `ref` doubles as the real Key Vault name -> must be globally unique, 3-24 chars.
      # Resource groups: declare them under `resource_groups` and pin a resource with
      # `resource_group:`. Omit `resource_group:` and the resource is placed randomly
      # across the declared groups; declare no groups at all and one is synthesized.
      #   resource_groups: [{ ref: rg-prod, location: "West US" }]
      #   key_vaults: [{ ref: badzure-ref-kv-01, resource_group: rg-prod }]
      key_vaults:   [{ ref: badzure-ref-kv-01 }]
    assignments:
      - { id: a1, type: azure_rbac, principal_ref: priya,
          role: "Key Vault Contributor", scope_ref: badzure-ref-kv-01 }
      - { id: a2, type: entra_role, principal_ref: billing-sync-app,
          role: "Global Administrator" }
    credentials:
      - { ref: app_secret, app_ref: billing-sync-app, type: password }
    data_injects:
      - { id: d1, material: app_secret, credential_ref: app_secret,
          location: key_vault_secret, location_ref: badzure-ref-kv-01,
          name: client-secret-billing-sync-app }
