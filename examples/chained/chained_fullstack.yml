# Phase-3 declarative graph config — a MULTI-TECHNIQUE, 8-hop attack chain.
#
# This is the showcase for the capability the generic-primitive re-architecture
# unlocked: a SINGLE declarative path that chains FIVE distinct privilege-escalation
# techniques into one traversable graph. None of this needed a new macro or new
# Terraform — it's just generic primitive edges wired over shared symbolic refs,
# and the reachability gate proves it end-to-end before any `terraform apply`.
#
# The chain ("Pipeline to Global Admin"):
#
#   1. INITIAL ACCESS   compromise sp-ci          (leaked CI/CD client secret)
#   2. app_ownership     sp-ci  owns  app-automation        [Application Ownership Abuse]
#   3. group_membership  app-automation ∈ engineers         [Group Membership]
#   4. group_membership  engineers ∈ cloud-ops  (NESTED)    [Group Membership]
#   5. azure_rbac        cloud-ops →VM Contributor→ vm01     [Managed Identity Abuse]
#   6. azure_rbac        vm01(MI) →KV Secrets User→ kv01     (the MI can now read the vault)
#   7. data_inject       loot app-ga's secret out of kv01   [Key Vault Secret Theft]
#   8. entra_role        app-ga holds Global Administrator   <- OBJECTIVE
#
# Why the reachability walk (src/reachability.py) accepts it — the CONTROL set grows:
#   seed {sp-ci}
#     +app-automation  (app_ownership edge; source sp-ci controlled)
#     +engineers       (group_membership; source app-automation controlled)
#     +cloud-ops       (group_membership; source engineers controlled — nested groups
#                       chain transparently: the edge only checks "is the source
#                       controlled", not the principal's type)
#     +vm01            (azure_rbac VM Contributor is a CONTROL role -> you own the VM
#                       AND its managed identity)
#     +app-ga          (data_inject: vm01's MI holds a READ role on kv01, so it loots
#                       the planted client secret and takes over app-ga)
#   objective entra_role/Global Administrator: app-ga ∈ control AND holds GA -> REACHED.
#
# Primitive coverage: app_ownership, group_membership (x2), azure_rbac (x2),
# data_inject, app_credential (app-ga's planted secret + sp-ci's auto-minted
# initial-access secret), entra_role — 7 of the 9 generic primitives in one path.
#
# Free-tier safe: cloud-ops carries an AZURE RBAC role (not an Entra role), so it is
# an ordinary security group and static nesting under it is allowed.
#
# Live test:
#   python BadZure.py build --config examples/chained/chained_fullstack.yml --verbose
#   python BadZure.py destroy --verbose
#
# tenant_id/domain/subscription_id resolve from BADZURE_* env vars when null.

tenant:
  tenant_id: null
  domain: null
  subscription_id: null

attack_paths:
  pipeline_to_ga:
    objective:
      name: "Global Administrator via CI/CD pipeline"
      # Machine-checkable objective for the reachability gate: a controlled
      # principal must end up holding the Global Administrator Entra role.
      capability: entra_role
      role: "Global Administrator"
      impact: critical
      description: >-
        A leaked CI/CD service-principal secret is escalated, through app ownership,
        nested group membership, a VM managed identity, and a Key Vault secret theft,
        all the way to Global Administrator.
    metadata:
      complexity: high
      tags: [multi-technique, app-ownership, managed-identity, key-vault]
      # T1078 Valid Accounts · T1098 Account Manipulation (app cred / role add) ·
      # T1528 Steal App Access Token · T1555 Credentials from Password Stores
      mitre: [T1078, T1098, T1528, T1555]
    initial_access:
      method: compromised_identity
      principal_ref: sp-ci          # a service principal — its secret is auto-minted

    identities:
      # All three are applications (SP-backed). sp-ci is the foothold; app-automation
      # is the pivot; app-ga is the looted Global Administrator.
      applications:
        - { ref: sp-ci }
        - { ref: app-automation }
        - { ref: app-ga }
      groups:
        - { ref: engineers }        # inner (nested) group
        - { ref: cloud-ops }        # outer group; carries the VM RBAC role

    resources:
      # A resource ref doubles as the real resource name. vm01 is RG-scoped so the
      # name is fine as-is; the Key Vault name must be GLOBALLY UNIQUE (3-24 chars,
      # lowercase alphanumerics + hyphens) — change kv-replace-me in BOTH places below.
      # vm01 is pinned to rg-compute; the Key Vault names no resource_group, so it is
      # placed RANDOMLY across the declared groups.
      resource_groups:
        - { ref: rg-compute, location: "West US" }
        - { ref: rg-data,    location: "West US" }
      virtual_machines: [{ ref: vm01, resource_group: rg-compute }]
      key_vaults:       [{ ref: kv-replace-me }]

    assignments:
      # 2) sp-ci owns app-automation -> can mint a credential on it and act as it.
      - { id: own1, type: app_ownership, principal_ref: sp-ci, app_ref: app-automation }

      # 3) app-automation is a member of the engineers group.
      - { id: mem1, type: group_membership, principal_ref: app-automation, group_ref: engineers }

      # 4) engineers is nested inside cloud-ops (group-in-group) -> members of
      #    engineers inherit everything cloud-ops is granted.
      - { id: mem2, type: group_membership, principal_ref: engineers, group_ref: cloud-ops }

      # 5) cloud-ops gets Virtual Machine Contributor on vm01 -> control the VM and,
      #    crucially, act as its system-assigned managed identity.
      - { id: rbac1, type: azure_rbac, principal_ref: cloud-ops,
          role: "Virtual Machine Contributor", scope_ref: vm01 }

      # 6) vm01's MANAGED IDENTITY gets Key Vault Secrets User on the vault. The
      #    principal is the VM resource itself acting as its MI, so principal_type and
      #    mi_source must be explicit (a resource ref can't be inferred as a principal).
      - { id: rbac2, type: azure_rbac, principal_ref: vm01,
          principal_type: managed_identity, mi_source: vm,
          role: "Key Vault Secrets User", scope_ref: kv-replace-me }

      # 8) the looted app is Global Administrator — controlling it is the escalation.
      - { id: role1, type: entra_role, principal_ref: app-ga, role: "Global Administrator" }

    credentials:
      # The client secret that gets planted in the vault and looted at hop 7.
      - { ref: ga_secret, app_ref: app-ga, type: password }

    data_injects:
      # 7) plant app-ga's client secret as a Key Vault secret. Whoever can read the
      #    vault (the VM's MI, via hop 6) loots it and takes over app-ga.
      - { id: d1, material: app_secret, credential_ref: ga_secret,
          location: key_vault_secret, location_ref: kv-replace-me,
          name: client-secret-app-ga }
