# =============================================================================
# Phase-3 declarative graph config — "APEX": a 20-step, maximally-diverse,
# multi-technique attack chain. This is a deliberate STRESS TEST of the IR: how
# long and varied a traversable chain can the generic-primitive vocabulary + the
# reachability gate express and deploy, with NO new macros and NO new Terraform?
#
# It chains EVERY identity- and resource-based escalation BadZure models, looping
# identity-plane -> resource-plane -> identity-plane four times, and exercises all
# four managed-identity source types (function app, VM, automation account, logic
# app) and three data-store types (storage, Key Vault, Cosmos DB).
#
# -----------------------------------------------------------------------------
# THE 20 STEPS (the reachability walk derives exactly these from the graph):
#   1.  Compromise sp-ci                                  (leaked CI/CD secret)
#   2.  app_ownership      sp-ci → app-build-agent        [App Ownership Abuse]
#   3.  group_membership   app-build-agent → g-engineering
#   4.  group_membership   g-engineering → g-devops       (nested)
#   5.  group_membership   g-devops → g-platform          (nested, 3 levels deep)
#   6.  azure_rbac(ctrl)   g-platform → func-bz-api01      [Managed Identity Abuse: Function App]
#   7.  data_inject loot   func MI reads stbzdata01 → app-secscanner   [Storage Secret Theft]
#   8.  app_ownership      app-secscanner → app-backup     [App Ownership Abuse]
#   9.  group_ownership    app-backup → g-cloud-admins     [Group Ownership Abuse]
#   10. azure_rbac(ctrl)   g-cloud-admins → vm-build01     [Managed Identity Abuse: VM]
#   11. data_inject loot   VM MI reads kv-bz-vault02 → app-hr-connector  [Key Vault Secret Theft]
#   12. app_ownership      app-hr-connector → app-graph-sync
#   13. group_membership   app-graph-sync → g-automation-ops
#   14. azure_rbac(ctrl)   g-automation-ops → auto-runbook01  [Managed Identity Abuse: Automation]
#   15. data_inject loot   Automation MI reads stbzdata03 → app-cert-mgr  [Storage Secret Theft]
#   16. app_ownership      app-cert-mgr → app-logic-svc
#   17. group_ownership    app-logic-svc → g-integration   [Group Ownership Abuse]
#   18. azure_rbac(ctrl)   g-integration → logic-etl01     [Managed Identity Abuse: Logic App]
#   19. data_inject loot   Logic-App MI reads kv-bz-vault04 → app-ga     [Key Vault Secret Theft]
#   20. entra_role         app-ga holds Global Administrator   <- OBJECTIVE (full tenant compromise)
#
# OFF-SPINE ENRICHMENT (real deployed edges that broaden the TTPs but aren't on
# the critical GA path, so the gate doesn't count them as hops — the narrative
# still describes them):
#   - api_permission   app-build-agent → Directory.Read.All   (recon, T1087)
#   - api_permission   app-graph-sync  → Mail.Read            (mailbox exfil, T1114)
#   - azure_rbac(read) VM MI → Cosmos DB Account Reader Role → cosmos-bz-app01  (T1530)
#   - group_ownership  svc-it-admin (USER) → g-engineering    (a human admin behind the group)
#   - au_membership    svc-it-admin (USER)  → au-corp-tier0
#   - au_membership    g-cloud-admins (GROUP) → au-corp-tier0
#
# -----------------------------------------------------------------------------
# WHY IT STAYS TRAVERSABLE (and why every loot is in its OWN store):
#   Each managed identity gets a Key-Vault/Storage read role scoped to a SINGLE
#   resource. If two planted secrets shared one vault, the walk would loot BOTH
#   the instant any reader controlled that vault — short-circuiting the chain.
#   Four loots -> four distinct stores (stbzdata01, kv-bz-vault02, stbzdata03,
#   kv-bz-vault04), each readable by exactly one MI, forces the 20 hops in order.
#
# PRIMITIVE COVERAGE: all 9 — entra_role, azure_rbac (control+read), api_permission,
# app_credential, data_inject (storage_blob + key_vault_secret), group_membership,
# group_ownership, app_ownership, au_membership.
#
# -----------------------------------------------------------------------------
# !!! BEFORE A LIVE BUILD — make these 6 GLOBALLY-UNIQUE names your own:
#     key vaults : kv-bz-vault02, kv-bz-vault04         (3-24 chars, alnum + hyphen)
#     storage    : stbzdata01, stbzdata03               (3-24 chars, lowercase alnum ONLY)
#     cosmos db  : cosmos-bz-app01                      (lowercase, global)
#     function   : func-bz-api01                        (global on azurewebsites.net)
#     Edit each in its resources: block AND every assignment/inject that names it.
#
# COST/TIME WARNING: this deploys 4 compute resources (VM + function + automation +
# logic app) + 2 Key Vaults + 2 storage accounts + 1 Cosmos DB. Expect a long apply
# and real Azure spend. This is a showcase/limits fixture, not a cheap one.
#
# Live test:
#   python BadZure.py build --config examples/chained/chained_apex.yml --verbose
#   python BadZure.py destroy --verbose
# =============================================================================

tenant:
  tenant_id: null
  domain: null
  subscription_id: null

attack_paths:
  apex_to_global_admin:
    objective:
      name: "Global Administrator via a 20-hop multi-cloud-plane chain"
      capability: entra_role
      role: "Global Administrator"
      impact: critical
      description: >-
        A single leaked CI/CD service-principal secret is escalated, across twenty
        discrete hops spanning application ownership, nested group membership and
        ownership, four distinct managed identities, and four secret thefts, all the
        way to Global Administrator and full tenant compromise.
    metadata:
      complexity: extreme
      tags: [multi-technique, app-ownership, group-ownership, managed-identity,
             key-vault, storage, cosmos-db, mail-exfil, showcase]
      # T1078 Valid Accounts · T1098 Account Manipulation · T1528 Steal App Token
      # T1555 Credentials from Password Stores · T1530 Data from Cloud Storage
      # T1114 Email Collection · T1087 Account Discovery
      mitre: [T1078, T1098, T1528, T1555, T1530, T1114, T1087]
    initial_access:
      method: compromised_identity
      principal_ref: sp-ci

    # -- entities -------------------------------------------------------------
    identities:
      users:
        - { ref: svc-it-admin }              # a human admin who fronts g-engineering
      applications:
        - { ref: sp-ci }                     # foothold (secret auto-minted)
        - { ref: app-build-agent }
        - { ref: app-secscanner }            # looted from stbzdata01
        - { ref: app-backup }
        - { ref: app-hr-connector }          # looted from kv-bz-vault02
        - { ref: app-graph-sync }
        - { ref: app-cert-mgr }              # looted from stbzdata03
        - { ref: app-logic-svc }
        - { ref: app-ga }                    # looted from kv-bz-vault04; holds GA
      groups:
        - { ref: g-engineering }
        - { ref: g-devops }                  # nested in g-platform
        - { ref: g-platform }                # carries the Function App RBAC
        - { ref: g-cloud-admins }            # carries the VM RBAC
        - { ref: g-automation-ops }          # carries the Automation RBAC
        - { ref: g-integration }             # carries the Logic App RBAC
      administrative_units:
        - { ref: au-corp-tier0 }

    resources:
      # All globally-unique names below must be made unique before a live build.
      # Resource groups: compute foothold resources land in rg-compute, the looted
      # data stores in rg-data. A couple are left unpinned (no `resource_group`) to
      # show those getting distributed RANDOMLY across the declared groups.
      resource_groups:
        - { ref: rg-compute, location: "West US" }
        - { ref: rg-data,    location: "West US" }
        - { ref: rg-shared,  location: "West US" }
      virtual_machines:    [{ ref: vm-build01, resource_group: rg-compute }]
      function_apps:       [{ ref: func-bz-api01, resource_group: rg-compute }]
      automation_accounts: [{ ref: auto-runbook01, resource_group: rg-compute }]
      logic_apps:          [{ ref: logic-etl01 }]                                  # random placement
      key_vaults:          [{ ref: kv-bz-vault02, resource_group: rg-data }, { ref: kv-bz-vault04, resource_group: rg-data }]
      storage_accounts:    [{ ref: stbzdata01, resource_group: rg-data }, { ref: stbzdata03 }]   # stbzdata03 random
      cosmos_dbs:          [{ ref: cosmos-bz-app01, resource_group: rg-data }]

    # -- the chain ------------------------------------------------------------
    assignments:
      # ===== ACT I — foothold, identity recon, first managed-identity pivot =====
      # 2) sp-ci owns app-build-agent (a build automation SP).
      - { id: own1, type: app_ownership, principal_ref: sp-ci, app_ref: app-build-agent }
      # recon (off-spine): the build agent can read the whole directory.
      - { id: api_recon, type: api_permission, principal_ref: app-build-agent,
          api_type: graph, app_role: "Directory.Read.All" }
      # 3-5) build-agent -> engineering -> devops -> platform (3-level nested groups).
      - { id: mem1, type: group_membership, principal_ref: app-build-agent, group_ref: g-engineering }
      - { id: mem2, type: group_membership, principal_ref: g-engineering, group_ref: g-devops }
      - { id: mem3, type: group_membership, principal_ref: g-devops, group_ref: g-platform }
      # 6) g-platform can operate the function app -> control it + its managed identity.
      - { id: rbac_f_ctrl, type: azure_rbac, principal_ref: g-platform,
          role: "Website Contributor", scope_ref: func-bz-api01 }
      # (read edge) the function MI can read storage account stbzdata01.
      - { id: rbac_f_read, type: azure_rbac, principal_ref: func-bz-api01,
          principal_type: managed_identity, mi_source: function_app,
          role: "Storage Blob Data Reader", scope_ref: stbzdata01 }

      # ===== ACT II — privileged group takeover, VM theft, side collection =====
      # 8) the looted secscanner SP owns the backup SP.
      - { id: own2, type: app_ownership, principal_ref: app-secscanner, app_ref: app-backup }
      # 9) the backup SP OWNS the cloud-admins group -> wield its grants.
      - { id: own3, type: group_ownership, principal_ref: app-backup, group_ref: g-cloud-admins }
      # 10) cloud-admins can operate the build VM -> control it + its managed identity.
      - { id: rbac_v_ctrl, type: azure_rbac, principal_ref: g-cloud-admins,
          role: "Virtual Machine Contributor", scope_ref: vm-build01 }
      # (read edge) the VM MI can read Key Vault kv-bz-vault02.
      - { id: rbac_v_read, type: azure_rbac, principal_ref: vm-build01,
          principal_type: managed_identity, mi_source: vm,
          role: "Key Vault Secrets User", scope_ref: kv-bz-vault02 }
      # (off-spine collection) the VM MI can also read the Cosmos DB account.
      - { id: rbac_v_cosmos, type: azure_rbac, principal_ref: vm-build01,
          principal_type: managed_identity, mi_source: vm,
          role: "Cosmos DB Account Reader Role", scope_ref: cosmos-bz-app01 }

      # ===== ACT III — automation pivot, second storage theft =====
      # 12) the looted hr-connector SP owns the graph-sync SP.
      - { id: own4, type: app_ownership, principal_ref: app-hr-connector, app_ref: app-graph-sync }
      # (off-spine exfil) graph-sync can read all mailboxes.
      - { id: api_mail, type: api_permission, principal_ref: app-graph-sync,
          api_type: graph, app_role: "Mail.Read" }
      # 13) graph-sync is a member of automation-ops.
      - { id: mem4, type: group_membership, principal_ref: app-graph-sync, group_ref: g-automation-ops }
      # 14) automation-ops can operate the automation account -> MI.
      - { id: rbac_a_ctrl, type: azure_rbac, principal_ref: g-automation-ops,
          role: "Automation Contributor", scope_ref: auto-runbook01 }
      # (read edge) the automation MI can read storage account stbzdata03.
      - { id: rbac_a_read, type: azure_rbac, principal_ref: auto-runbook01,
          principal_type: managed_identity, mi_source: automation_account,
          role: "Storage Blob Data Reader", scope_ref: stbzdata03 }

      # ===== ACT IV — logic-app pivot, final theft, Global Administrator =====
      # 16) the looted cert-mgr SP owns the logic-svc SP.
      - { id: own5, type: app_ownership, principal_ref: app-cert-mgr, app_ref: app-logic-svc }
      # 17) logic-svc OWNS the integration group.
      - { id: own6, type: group_ownership, principal_ref: app-logic-svc, group_ref: g-integration }
      # 18) integration can operate the logic app -> MI.
      - { id: rbac_l_ctrl, type: azure_rbac, principal_ref: g-integration,
          role: "Logic App Contributor", scope_ref: logic-etl01 }
      # (read edge) the logic-app MI can read Key Vault kv-bz-vault04.
      - { id: rbac_l_read, type: azure_rbac, principal_ref: logic-etl01,
          principal_type: managed_identity, mi_source: logic_app,
          role: "Key Vault Secrets User", scope_ref: kv-bz-vault04 }
      # 20) the final looted app holds Global Administrator — the objective.
      - { id: role_ga, type: entra_role, principal_ref: app-ga, role: "Global Administrator" }

      # ===== off-spine structural realism =====
      # A human admin owns the entry-point engineering group...
      - { id: own_user, type: group_ownership, principal_ref: svc-it-admin, group_ref: g-engineering }
      # ...and both that admin and the cloud-admins group sit in a Tier-0 admin AU.
      - { id: au_user,  type: au_membership, principal_ref: svc-it-admin,   au_ref: au-corp-tier0 }
      - { id: au_group, type: au_membership, principal_ref: g-cloud-admins, au_ref: au-corp-tier0 }

    # -- planted credentials (passwords) the loots steal ----------------------
    credentials:
      - { ref: cr_secscanner, app_ref: app-secscanner,   type: password }
      - { ref: cr_hrconn,     app_ref: app-hr-connector, type: password }
      - { ref: cr_certmgr,    app_ref: app-cert-mgr,     type: password }
      - { ref: cr_ga,         app_ref: app-ga,           type: password }

    # -- the four planted secrets, each in its OWN store ----------------------
    data_injects:
      - { id: d1, material: app_secret, credential_ref: cr_secscanner,
          location: storage_blob,      location_ref: stbzdata01,    name: deploy-config.json }
      - { id: d2, material: app_secret, credential_ref: cr_hrconn,
          location: key_vault_secret,  location_ref: kv-bz-vault02, name: hr-connector-client-secret }
      - { id: d3, material: app_secret, credential_ref: cr_certmgr,
          location: storage_blob,      location_ref: stbzdata03,    name: backup-service-creds.txt }
      - { id: d4, material: app_secret, credential_ref: cr_ga,
          location: key_vault_secret,  location_ref: kv-bz-vault04, name: directorysync-client-secret }
