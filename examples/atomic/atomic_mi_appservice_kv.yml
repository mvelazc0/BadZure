# ManagedIdentityAbuse with an App Service source. The attacker holds Website
# Contributor on the App Service, steals its managed identity token via the Kudu/SCM
# REST API, and pivots to a Key Vault secret. No application vulnerability needed.
#
# Live test:
#   python BadZure.py build --config examples/atomic/atomic_mi_appservice_kv.yml --verbose
#   python BadZure.py destroy --verbose

tenant:
  tenant_id: null
  domain: null
  subscription_id: null
baseline:
  identities:
    users: 2
    groups: 1
    applications: 2
  resources:
    resource_groups: 2
    key_vaults: 1
    app_services: 1
attack_paths:
  mi_abuse_appservice_kv:
    initial_access:
      vector: compromised_credential
      principal_type: user
    privilege_escalation:
      technique: ManagedIdentityAbuse
      source_type: app_service
      privilege_source: stored_credential
      target_resource_type: key_vault
      credential_type: secret
      assignment_type: direct
    objective:
      api_permission:
        graph: 06b708a9-e830-4db3-a914-8e69da51d44f
