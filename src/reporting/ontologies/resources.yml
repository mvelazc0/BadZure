name: resources

node_types:
  Subscription:
    properties:
      - subscription_id
      - resource_group_count
      - resource_count
      - resource_type_count
      - region_count
      - regions
    required_properties: [resource_group_count, resource_count, resource_type_count, region_count]
  ResourceGroup:
    properties: [location, resource_count, resource_type_count, resource_types, empty]
    required_properties: [resource_count, resource_type_count, empty]
  UnplacedResources:
    properties: [resource_count, resource_type_count, resource_types, warning]
    required_properties: [resource_count, resource_type_count, warning]
  KeyVaultSummary: &resource_summary
    properties: [count, resources]
    required_properties: [count]
  StorageAccountSummary: *resource_summary
  VirtualMachineSummary: *resource_summary
  LogicAppSummary: *resource_summary
  AutomationAccountSummary: *resource_summary
  FunctionAppSummary: *resource_summary
  AppServiceSummary: *resource_summary
  CosmosDBSummary: *resource_summary

edge_types:
  CONTAINS:
    from: [Subscription, ResourceGroup, UnplacedResources]
    to:
      - ResourceGroup
      - UnplacedResources
      - KeyVaultSummary
      - StorageAccountSummary
      - VirtualMachineSummary
      - LogicAppSummary
      - AutomationAccountSummary
      - FunctionAppSummary
      - AppServiceSummary
      - CosmosDBSummary
    properties: [count]
