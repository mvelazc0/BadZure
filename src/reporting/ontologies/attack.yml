name: attack

node_types:
  Attacker:
    properties: []
  Identity:
    properties: [ref, identity_type, controlled]
    required_properties: [ref]
  ComputeResource:
    properties: [ref, resource_type, controlled]
    required_properties: [ref]
  DataResource:
    properties: [ref, resource_type]
    required_properties: [ref]
  Credential:
    properties:
      - credential_type
      - material
      - source_ref
      - created_by_attacker
      - target_ref
      - authorization_source
      - authorization_role
  Session:
    properties: [principal_ref]
  Objective:
    properties: [capability, status, impact, reason, target_ref]
    required_properties: [status]

edge_types:
  COMPROMISES: &action
    from: [Attacker, Identity, Session]
    to: [Identity, Session]
    properties: [action, step, mitre, uses, original_action]
  EXPLOITS:
    <<: *action
    to: [ComputeResource]
  ADDS_APP_CREDENTIAL:
    from: [Attacker, Identity, Session]
    to: [Credential]
    properties:
      - action
      - step
      - mitre
      - uses
      - original_action
      - target_ref
      - authorization_source
      - authorization_role
  ADDS_SELF_TO_GROUP:
    <<: *action
    to: [Identity]
  INHERITS_ACCESS:
    <<: *action
    to: [Identity]
  EXECUTES_ON:
    <<: *action
    to: [ComputeResource]
  USES_MANAGED_IDENTITY:
    <<: *action
    from: [Attacker, Identity, ComputeResource, Session]
    to: [Identity]
  READS:
    <<: *action
    from: [Attacker, Identity, ComputeResource, Session]
    to: [DataResource]
  STEALS_CREDENTIAL:
    <<: *action
    from: [Attacker, Identity, ComputeResource, DataResource, Session]
    to: [Credential]
  AUTHENTICATES_AS:
    from: [Attacker, Credential, Session]
    to: [Identity, Session]
    properties:
      - action
      - step
      - mitre
      - uses
      - original_action
      - target_ref
      - authorization_source
      - authorization_role
  ACHIEVES:
    <<: *action
    from: [Attacker, Identity, ComputeResource, DataResource, Session]
    to: [Objective]
  BLOCKED_AT:
    <<: *action
    from: [Attacker, Identity, ComputeResource, DataResource, Credential, Session]
    to: [Objective]
    properties: [action, step, mitre, uses, original_action, status, reason]
    required_properties: [status]
  TARGETS:
    <<: *action
    from: [Attacker, Identity, ComputeResource, DataResource, Credential, Session]
    to: [Objective]
    properties: [action, step, mitre, uses, original_action, status, reason]
    required_properties: [status]
  PERFORMS_ACTION:
    <<: *action
    from: [Attacker, Identity, ComputeResource, DataResource, Credential, Session]
    to: [Identity, ComputeResource, DataResource, Credential, Session, Objective]
    required_properties: [original_action]
