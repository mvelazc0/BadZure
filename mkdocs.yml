site_name: BadZure Documentation
site_description: Automate the deployment of intentionally misconfigured Entra ID tenants and Azure subscriptions, populating them with diverse entities and exploitable attack paths.
site_author: Mauricio Velazco
site_url: https://www.badzure.com
copyright: Maintained by Mauricio Velazco and contributors

repo_name: mvelazc0/BadZure
repo_url: https://github.com/mvelazc0/BadZure

theme:
  name: material
  custom_dir: docs/overrides
  logo: img/BadZure-cropped.png
  favicon: img/BadZure-cropped.png
  palette:
    - scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
    - toc.integrate

nav:
  - Start Here:
    - Introduction: index.md
    - Installation: installation.md
    - Your First Lab: first-lab.md
  - Cloud Attack Paths:
    - Attack Paths Explained: attack-paths/explained.md
    - How to Read These Graphs: attack-paths/reading-graphs.md
    - Anatomy of a Path: attack-paths/anatomy.md
    - Initial Access: attack-paths/initial-access.md
  - Atomic & Chained Paths:
    - Overview: attack-paths/atomic-vs-chained.md
    - Atomic Techniques:
      - Overview: attack-paths/techniques/index.md
      - ApplicationOwnershipAbuse: attack-paths/techniques/application-ownership-abuse.md
      - ApplicationAdministratorAbuse: attack-paths/techniques/application-administrator-abuse.md
      - CloudAppAdministratorAbuse: attack-paths/techniques/cloud-app-administrator-abuse.md
      - ManagedIdentityAbuse: attack-paths/techniques/managed-identity-abuse.md
      - KeyVaultSecretTheft: attack-paths/techniques/keyvault-secret-theft.md
      - StorageCertificateTheft: attack-paths/techniques/storage-certificate-theft.md
      - CosmosDBSecretTheft: attack-paths/techniques/cosmosdb-secret-theft.md
    - Chained Paths and Primitives: attack-paths/chaining.md
  - Building Labs:
    - Lab Anatomy: building/lab-anatomy.md
    - Author an Atomic Path: building/authoring-atomic.md
    - Author a Chained Path: building/authoring-chained.md
    - Authoring with Claude Code: building/authoring-with-claude.md
  - Reference:
    - CLI Commands: reference/commands.md
    - Tenant & Baseline: reference/tenant-baseline.md
    - Atomic Path Options: reference/atomic.md
    - Chained Path Schema: reference/chained.md
    - Vocabulary: reference/vocabulary.md
  - Project:
    - What's New: whats-new.md
    - Talks & Demos: talks-and-demos.md

hooks:
  - docs/hooks/reports.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/graph-theme.js

extra:
  analytics:
    provider: google
    property: G-1B8G0DW1EN
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvelazc0/BadZure
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/mvelazco
